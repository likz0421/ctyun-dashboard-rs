<%+header%>

<style>
.ct-wrap{font-size:13px;max-width:1100px}
.ct-card{background:var(--background-color,#fff);border:1px solid var(--border-color,#ddd);border-radius:10px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.ct-kpi{text-align:center;padding:14px 8px}
.ct-kpi b{display:block;font-size:26px;font-weight:700;color:var(--text-color,#333);line-height:1.2}
.ct-kpi span{font-size:12px;opacity:.7}
.ct-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border-color,#eee);gap:10px}
.ct-row:last-child{border-bottom:none}
.ct-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.ct-online{background:#2f9e6a}.ct-offline{background:#c94a4a}
.ct-acc{border-left:3px solid #5b8cff;padding:10px 14px;margin:10px 0;background:rgba(91,140,255,.05);border-radius:6px}
.ct-btn{display:inline-block;padding:6px 13px;background:#5b8cff;color:#fff;text-decoration:none;border:none;border-radius:6px;font-size:12px;cursor:pointer;margin:2px 3px 2px 0}
.ct-btn:hover{background:#4a7ae0}
.ct-btn.ghost{background:transparent;color:#5b8cff;border:1px solid #5b8cff}
.ct-btn.warn{background:#c94a4a}.ct-btn.warn:hover{background:#b03b3b}
.ct-btn.mini{padding:4px 9px;font-size:11px}
.ct-tabs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 14px;border-bottom:1px solid var(--border-color,#ddd)}
.ct-tab{padding:9px 15px;cursor:pointer;border:none;background:transparent;color:var(--text-color,#333);font-size:13px;border-bottom:2px solid transparent}
.ct-tab.active{color:#5b8cff;border-bottom-color:#5b8cff;font-weight:600}
.ct-view{display:none}.ct-view.show{display:block}
.ct-input,.ct-select{padding:7px 10px;border:1px solid var(--border-color,#ccc);border-radius:6px;background:var(--background-color,#fff);color:var(--text-color,#333);font-size:13px;margin:2px 0}
.ct-input:focus,.ct-select:focus{outline:none;border-color:#5b8cff}
.ct-field{display:flex;flex-direction:column;gap:3px;margin:8px 0}
.ct-field label{font-size:12px;opacity:.75}
.ct-msg{padding:9px 12px;border-radius:6px;margin:8px 0;font-size:12px;display:none}
.ct-msg.ok{display:block;background:rgba(47,158,106,.12);color:#2f9e6a}
.ct-msg.err{display:block;background:rgba(201,74,74,.12);color:#c94a4a}
.ct-login{max-width:340px;margin:30px auto;text-align:center}
.ct-login .ct-input{width:100%;box-sizing:border-box}
.ct-log{font-family:monospace;font-size:11px;line-height:1.7;max-height:420px;overflow:auto;background:rgba(0,0,0,.04);padding:10px;border-radius:6px}
.ct-log div{border-bottom:1px solid rgba(128,128,128,.15);padding:2px 0}
.ct-log .t{opacity:.6}.ct-log .success{color:#2f9e6a}.ct-log .error{color:#c94a4a}
.ct-muted{opacity:.6}.ct-right{margin-left:auto}
.ct-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:rgba(91,140,255,.15);color:#5b8cff}
.ct-spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(91,140,255,.3);border-top-color:#5b8cff;border-radius:50%;animation:ctspin .8s linear infinite;vertical-align:middle}
@keyframes ctspin{to{transform:rotate(360deg)}}
.ct-toggle{position:relative;width:36px;height:20px;background:#ccc;border-radius:10px;cursor:pointer;display:inline-block;transition:.2s}
.ct-toggle.on{background:#2f9e6a}.ct-toggle::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
.ct-toggle.on::after{left:18px}
</style>

<div class="ct-wrap">
  <h2><%:天翼云电脑 · 控制中心%></h2>

  <!-- 登录层 -->
  <div id="ct-login" class="ct-card ct-login">
    <h3><%:登录控制面板%></h3>
    <p class="ct-muted"><%:使用面板账号登录，token 仅保存在当前浏览器会话%></p>
    <div class="ct-field"><input id="ct-u" class="ct-input" placeholder="<%:用户名%>" value="admin"></div>
    <div class="ct-field"><input id="ct-p" class="ct-input" type="password" placeholder="<%:密码%>"></div>
    <button class="ct-btn" id="ct-login-btn" style="width:100%;margin-top:8px"><%:登录%></button>
    <div id="ct-login-msg" class="ct-msg"></div>
  </div>

  <!-- 主界面 -->
  <div id="ct-main" style="display:none">
    <div class="ct-tabs">
      <button class="ct-tab active" data-view="overview"><%:总览%></button>
      <button class="ct-tab" data-view="accounts"><%:账号%></button>
      <button class="ct-tab" data-view="tasks"><%:任务%></button>
      <button class="ct-tab" data-view="power"><%:电源%></button>
      <button class="ct-tab" data-view="logs"><%:日志%></button>
      <button class="ct-tab" data-view="settings"><%:设置%></button>
      <button class="ct-tab ct-right" id="ct-logout"><%:退出%></button>
    </div>

    <div id="ct-msg" class="ct-msg"></div>

    <!-- 总览 -->
    <div class="ct-view show" data-view="overview">
      <div class="ct-grid" id="ct-kpi"></div>
      <div class="ct-card" id="ct-account-list"></div>
    </div>

    <!-- 账号 -->
    <div class="ct-view" data-view="accounts">
      <div class="ct-card">
        <h3><%:添加账号%></h3>
        <div class="ct-grid">
          <div class="ct-field"><label><%:账号名称%></label><input id="na-name" class="ct-input" placeholder="<%:备注名%>"></div>
          <div class="ct-field"><label><%:手机号%></label><input id="na-user" class="ct-input"></div>
          <div class="ct-field"><label><%:密码%></label><input id="na-pass" class="ct-input" type="password"></div>
          <div class="ct-field"><label><%:设备码(可留空)%></label><input id="na-dc" class="ct-input"></div>
        </div>
        <button class="ct-btn" id="ct-add-account"><%:添加%></button>
        <span class="ct-muted" style="margin-left:10px"><%:扫码登录请用完整面板%></span>
      </div>
      <div class="ct-card" id="ct-account-manage"></div>
    </div>

    <!-- 任务 -->
    <div class="ct-view" data-view="tasks">
      <div class="ct-card">
        <p><%:选择账号后执行。签到/挂机为异步任务，积分到账需官方确认（约十几分钟）。%></p>
        <div class="ct-field"><label><%:账号%></label><select id="tk-account" class="ct-select"></select></div>
        <button class="ct-btn" data-task="sign"><%:签到认领%></button>
        <button class="ct-btn" data-task="hang"><%:挂机1小时%></button>
        <button class="ct-btn" data-task="aiChat"><%:AI对话%></button>
        <button class="ct-btn ghost" id="ct-task-trigger"><%:立即执行全部每日任务%></button>
        <button class="ct-btn ghost" id="ct-keeper-restart"><%:重启保活%></button>
      </div>
      <div class="ct-card" id="ct-task-status"><%:加载中...%></div>
    </div>

    <!-- 电源 -->
    <div class="ct-view" data-view="power">
      <div class="ct-card">
        <div class="ct-field"><label><%:账号%></label><select id="pw-account" class="ct-select"></select></div>
        <div class="ct-field"><label><%:云电脑%></label><select id="pw-desktop" class="ct-select"></select></div>
        <button class="ct-btn" data-power="poweron"><%:开机%></button>
        <button class="ct-btn" data-power="awake"><%:唤醒%></button>
        <button class="ct-btn" data-power="reboot"><%:重启%></button>
        <button class="ct-btn warn" data-power="poweroff"><%:关机%></button>
      </div>
    </div>

    <!-- 日志 -->
    <div class="ct-view" data-view="logs">
      <div class="ct-card">
        <button class="ct-btn" id="ct-log-refresh"><%:刷新%></button>
        <button class="ct-btn ghost" id="ct-log-clear"><%:清空日志%></button>
        <label style="margin-left:12px"><input type="checkbox" id="ct-log-auto" checked> <%:自动刷新%></label>
        <div class="ct-log" id="ct-log-box"></div>
      </div>
    </div>

    <!-- 设置 -->
    <div class="ct-view" data-view="settings">
      <div class="ct-card">
        <h3><%:通知设置%></h3>
        <div id="ct-notify-box"><%:加载中...%></div>
        <button class="ct-btn" id="ct-notify-save"><%:保存通知设置%></button>
        <button class="ct-btn ghost" id="ct-notify-test"><%:发送测试%></button>
      </div>
      <div class="ct-card">
        <h3><%:配置管理%></h3>
        <a class="ct-btn ghost" id="ct-export" href="#"><%:导出配置%></a>
        <button class="ct-btn ghost" id="ct-import"><%:导入配置%></button>
        <input type="file" id="ct-import-file" accept=".json" style="display:none">
      </div>
      <div class="ct-card">
        <h3><%:打开完整面板%></h3>
        <p class="ct-muted"><%:扫码登录、积分商城、短信绑定、远程桌面等高级功能请在独立面板操作%></p>
        <a class="ct-btn" id="ct-full-panel" target="_blank" href="#"><%:打开完整控制面板%></a>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var API = '<%=luci.dispatcher.build_url("admin/services/ctyun_dashboard/api")%>';
  var TOKEN = sessionStorage.getItem('ctyun_token') || '';
  var accounts = [], status = null, ip = '<%=luci.sys.exec("uci get network.lan.ipaddr 2>/dev/null"):gsub("%s+","")%>', port = '<%=luci.sys.exec("uci get ctyun_dashboard.main.port 2>/dev/null"):gsub("%s+","")%>';
  if(!port) port = '8571';

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function msg(text, ok){
    var el = document.getElementById('ct-msg');
    el.className = 'ct-msg ' + (ok?'ok':'err'); el.textContent = text;
    if(ok) setTimeout(function(){el.className='ct-msg';}, 3000);
  }
  function loginMsg(text, ok){
    var el=document.getElementById('ct-login-msg'); el.className='ct-msg '+(ok?'ok':'err'); el.textContent=text;
  }
  // 统一 API 调用：前端用 POST，method 参数指定真实方法
  function api(path, method, body, cb){
    var fd = new URLSearchParams();
    fd.append('path', path); fd.append('method', method||'GET');
    if(TOKEN) fd.append('token', TOKEN);
    if(body) fd.append('body', JSON.stringify(body));
    fetch(API, {method:'POST', body:fd, credentials:'same-origin'})
      .then(function(r){return r.json().catch(function(){return {error:'非JSON响应'};});})
      .then(function(d){
        if(d && (d.error==='未登录' || d.error==='会话已失效')){ showLogin(); return; }
        cb(d);
      })
      .catch(function(e){ cb({error:String(e)}); });
  }

  function showLogin(){
    document.getElementById('ct-login').style.display='block';
    document.getElementById('ct-main').style.display='none';
  }
  function showMain(){
    document.getElementById('ct-login').style.display='none';
    document.getElementById('ct-main').style.display='block';
  }

  document.getElementById('ct-login-btn').onclick = function(){
    var u=document.getElementById('ct-u').value, p=document.getElementById('ct-p').value;
    var fd=new URLSearchParams(); fd.append('path','/api/auth/login'); fd.append('method','POST');
    fd.append('body',JSON.stringify({username:u,password:p}));
    this.disabled=true; loginMsg('登录中...', true);
    fetch(API,{method:'POST',body:fd,credentials:'same-origin'})
      .then(function(r){return r.json();})
      .then(function(d){
        document.getElementById('ct-login-btn').disabled=false;
        if(d && d.token){ TOKEN=d.token; sessionStorage.setItem('ctyun_token',TOKEN); loginMsg('登录成功',true); showMain(); refreshAll(); }
        else loginMsg(d&&d.error?d.error:'登录失败', false);
      }).catch(function(e){ document.getElementById('ct-login-btn').disabled=false; loginMsg(String(e),false); });
  };
  document.getElementById('ct-p').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('ct-login-btn').click();});
  document.getElementById('ct-logout').onclick = function(){
    api('/api/auth/logout','POST',{},function(){});
    TOKEN=''; sessionStorage.removeItem('ctyun_token'); showLogin();
  };

  // Tab 切换
  Array.prototype.forEach.call(document.querySelectorAll('.ct-tab[data-view]'), function(t){
    t.onclick = function(){
      Array.prototype.forEach.call(document.querySelectorAll('.ct-tab'),function(x){x.classList.remove('active');});
      Array.prototype.forEach.call(document.querySelectorAll('.ct-view'),function(x){x.classList.remove('show');});
      t.classList.add('active');
      document.querySelector('.ct-view[data-view="'+t.dataset.view+'"]').classList.add('show');
      if(t.dataset.view==='logs') loadLogs();
      if(t.dataset.view==='tasks') loadTaskStatus();
      if(t.dataset.view==='settings') loadNotify();
    };
  });

  function loadAccounts(cb){
    api('/api/accounts','GET',null,function(d){
      accounts = Array.isArray(d)?d:[];
      fillAccountSelects();
      renderOverview(); renderAccountManage();
      if(cb)cb();
    });
  }
  function refreshAll(){
    api('/api/status','GET',null,function(d){ status=d; });
    loadAccounts();
  }

  function fillAccountSelects(){
    ['tk-account','pw-account'].forEach(function(id){
      var sel=document.getElementById(id); if(!sel)return;
      var old=sel.value; sel.innerHTML='';
      accounts.forEach(function(a){
        var o=document.createElement('option'); o.value=a.id; o.textContent=a.name||a.user; sel.appendChild(o);
      });
      if(old)sel.value=old;
    });
    fillDesktops();
  }
  function fillDesktops(){
    var accId=document.getElementById('pw-account').value, sel=document.getElementById('pw-desktop');
    if(!sel)return; sel.innerHTML='';
    var a=accounts.filter(function(x){return x.id===accId;})[0];
    (a&&a.desktops||[]).forEach(function(d){
      var o=document.createElement('option'); o.value=d.desktop_id; o.textContent=d.desktop_name||d.desktop_id; sel.appendChild(o);
    });
  }
  document.getElementById('pw-account').addEventListener('change',fillDesktops);

  function renderOverview(){
    var online=accounts.filter(function(a){return a.stats&&a.stats.keep_alive_status==='online';}).length;
    var errs=accounts.filter(function(a){return a.session_expired||(a.stats&&a.stats.last_error);}).length;
    var pts=status&&status.totalEarnedPoints||0;
    document.getElementById('ct-kpi').innerHTML=
      '<div class="ct-kpi ct-card"><b>'+accounts.length+'</b><span><%:账号总数%></span></div>'+
      '<div class="ct-kpi ct-card"><b>'+online+'</b><span><%:在线保活%></span></div>'+
      '<div class="ct-kpi ct-card"><b>'+pts+'</b><span><%:今日积分%></span></div>'+
      '<div class="ct-kpi ct-card"><b>'+errs+'</b><span><%:异常账号%></span></div>';
    var h='';
    if(!accounts.length)h='<p class="ct-muted"><%:暂无账号，请在"账号"标签添加%></p>';
    accounts.forEach(function(a){
      var on=a.stats&&a.stats.keep_alive_status==='online';
      h+='<div class="ct-acc"><div class="ct-row"><span><b>'+esc(a.name||a.user)+'</b></span>'+
         '<span><i class="ct-dot '+(on?'ct-online':'ct-offline')+'"></i>'+(on?'<%:在线%>':'<%:离线%>')+'</span></div>'+
         '<div class="ct-row"><span><%:积分 / 今日成功%></span><span>'+((a.stats&&a.stats.points)||0)+' / '+((a.stats&&a.stats.today_success_count)||0)+'<%:次%></span></div>';
      (a.desktops||[]).forEach(function(d){
        h+='<div class="ct-row"><span>'+esc(d.desktop_name||d.desktop_id)+'</span><span>'+((d.live_metrics&&d.live_metrics.status)||'-')+' · <%:累计%> '+((d.live_metrics&&d.live_metrics.success_count)||0)+'<%:次%></span></div>';
      });
      h+='</div>';
    });
    document.getElementById('ct-account-list').innerHTML=h;
  }

  function renderAccountManage(){
    var h='';
    accounts.forEach(function(a){
      h+='<div class="ct-acc"><div class="ct-row"><span><b>'+esc(a.name||a.user)+'</b> <span class="ct-badge">'+(a.enabled?'<%:启用%>':'<%:停用%>')+'</span></span>'+
         '<span><span class="ct-toggle '+((a.enabled)?'on':'')+'" data-toggle="'+esc(a.id)+'"></span></span></div>'+
         '<div class="ct-row"><span class="ct-muted">'+esc(a.user)+'</span><span>'+
         '<button class="ct-btn mini ghost" data-edit="'+esc(a.id)+'"><%:编辑%></button>'+
         '<button class="ct-btn mini warn" data-del="'+esc(a.id)+'"><%:删除%></button></span></div></div>';
    });
    if(!accounts.length)h='<p class="ct-muted"><%:暂无账号%></p>';
    document.getElementById('ct-account-manage').innerHTML=h;

    Array.prototype.forEach.call(document.querySelectorAll('[data-toggle]'),function(el){
      el.onclick=function(){
        var a=accounts.filter(function(x){return x.id===el.dataset.toggle;})[0];
        var body=Object.assign({},a,{enabled:!a.enabled});
        delete body.saved_login_info;
        api('/api/accounts/'+encodeURIComponent(a.id),'PUT',body,function(d){ msg('<%:已更新启用状态%>',!d.error); refreshAll(); });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(el){
      el.onclick=function(){
        if(!confirm('<%:确认删除该账号？%>'))return;
        api('/api/accounts/'+encodeURIComponent(el.dataset.del),'DELETE',null,function(d){ msg(d.error||'<%:已删除%>',!d.error); refreshAll(); });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'),function(el){
      el.onclick=function(){
        var a=accounts.filter(function(x){return x.id===el.dataset.edit;})[0];
        var name=prompt('<%:账号名称%>',a.name||'');
        if(name==null)return;
        var body=Object.assign({},a,{name:name}); delete body.saved_login_info;
        api('/api/accounts/'+encodeURIComponent(a.id),'PUT',body,function(d){ msg('<%:已保存%>',!d.error); refreshAll(); });
      };
    });
  }

  document.getElementById('ct-add-account').onclick=function(){
    var body={
      name:document.getElementById('na-name').value,
      user:document.getElementById('na-user').value,
      password:document.getElementById('na-pass').value,
      deviceCode:document.getElementById('na-dc').value
    };
    if(!body.user||!body.password){msg('<%:手机号和密码不能为空%>',false);return;}
    this.disabled=true;
    api('/api/accounts','POST',body,function(d){
      document.getElementById('ct-add-account').disabled=false;
      msg(d.error||'<%:账号已添加%>',!d.error);
      if(!d.error){['na-name','na-user','na-pass','na-dc'].forEach(function(id){document.getElementById(id).value='';});}
      refreshAll();
    });
  };

  function loadTaskStatus(){
    api('/api/status','GET',null,function(d){
      var box=document.getElementById('ct-task-status'), h='<h3><%:积分任务进度%></h3>';
      var pd=(d&&d.pointsDetails)||[];
      if(!pd.length)h+='<p class="ct-muted"><%:暂无数据%></p>';
      pd.forEach(function(p){
        h+='<div class="ct-acc"><b>'+esc(p.accountName)+'</b> · <%:今日积分%> '+p.todayPoints+' / <%:总积分%> '+p.totalPoints;
        (p.tasks||[]).forEach(function(t){
          h+='<div class="ct-row"><span>'+esc(t.name)+'</span><span>'+t.progress+' '+(t.completed?'<span class="ct-badge"><%:完成%></span>':'<span class="ct-muted"><%:进行中%></span>')+'</span></div>';
        });
        h+='</div>';
      });
      box.innerHTML=h;
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-task]'),function(btn){
    btn.onclick=function(){
      var id=document.getElementById('tk-account').value;
      if(!id){msg('<%:请先添加并选择账号%>',false);return;}
      msg('<%:任务已下发: %>'+btn.dataset.task,true);
      api('/api/accounts/'+encodeURIComponent(id)+'/run/'+btn.dataset.task,'POST',{},function(d){ msg((d.message||d.error||'<%:已下发%>'),!d.error); setTimeout(loadTaskStatus,2000); });
    };
  });
  document.getElementById('ct-task-trigger').onclick=function(){
    api('/api/scheduler/trigger','POST',{},function(d){msg('<%:已触发每日任务%>',!d.error);});
  };
  document.getElementById('ct-keeper-restart').onclick=function(){
    api('/api/keeper/restart','POST',{},function(d){msg('<%:保活已重启%>',!d.error);});
  };

  Array.prototype.forEach.call(document.querySelectorAll('[data-power]'),function(btn){
    btn.onclick=function(){
      var id=document.getElementById('pw-account').value, did=document.getElementById('pw-desktop').value;
      if(!id||!did){msg('<%:请选择账号和云电脑%>',false);return;}
      if(btn.dataset.power==='poweroff'&&!confirm('<%:确认关机？%>'))return;
      api('/api/accounts/'+encodeURIComponent(id)+'/power/'+btn.dataset.power,'POST',{desktopId:did},function(d){ msg(d.message||d.error||'<%:已下发%>',!d.error); });
    };
  });

  function loadLogs(){
    api('/api/logs','GET',null,function(d){
      var rows=Array.isArray(d)?d:(d.logs||[]), h='';
      rows.slice(-200).forEach(function(r){
        h+='<div><span class="t">'+esc(r.timestamp||'')+'</span> ['+esc(r.source||'')+'] <span class="'+(r.level||'')+'">'+esc(r.message||'')+'</span></div>';
      });
      document.getElementById('ct-log-box').innerHTML=h||'<div class="ct-muted"><%:暂无日志%></div>';
      var box=document.getElementById('ct-log-box'); box.scrollTop=box.scrollHeight;
    });
  }
  document.getElementById('ct-log-refresh').onclick=loadLogs;
  document.getElementById('ct-log-clear').onclick=function(){
    if(!confirm('<%:确认清空日志？%>'))return;
    api('/api/logs/clear','POST',{},function(d){msg('<%:已清空%>',!d.error);loadLogs();});
  };
  setInterval(function(){ if(document.getElementById('ct-log-auto').checked && document.querySelector('.ct-view[data-view="logs"]').classList.contains('show')) loadLogs(); }, 8000);

  function loadNotify(){
    api('/api/user/notify','GET',null,function(d){
      var h='';
      Object.keys(d||{}).forEach(function(k){
        var v=d[k];
        if(typeof v==='boolean') h+='<div class="ct-row"><span>'+esc(k)+'</span><input type="checkbox" data-nk="'+esc(k)+'" '+(v?'checked':'')+'></div>';
        else h+='<div class="ct-field"><label>'+esc(k)+'</label><input class="ct-input" data-nk="'+esc(k)+'" value="'+esc(v)+'"></div>';
      });
      if(!h)h='<p class="ct-muted"><%:无通知配置%></p>';
      document.getElementById('ct-notify-box').innerHTML=h;
    });
  }
  document.getElementById('ct-notify-save').onclick=function(){
    var body={};
    Array.prototype.forEach.call(document.querySelectorAll('[data-nk]'),function(el){
      body[el.dataset.nk]=el.type==='checkbox'?el.checked:el.value;
    });
    api('/api/user/notify','PUT',body,function(d){msg('<%:通知设置已保存%>',!d.error);});
  };
  document.getElementById('ct-notify-test').onclick=function(){
    api('/api/user/notify/test','POST',{},function(d){msg(d.message||d.error||'<%:已发送%>',!d.error);});
  };
  document.getElementById('ct-export').onclick=function(e){
    e.preventDefault();
    api('/api/config/export','GET',null,function(d){
      var blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ctyun-config.json'; a.click();
    });
  };
  document.getElementById('ct-import').onclick=function(){document.getElementById('ct-import-file').click();};
  document.getElementById('ct-import-file').onchange=function(){
    var f=this.files[0]; if(!f)return;
    var r=new FileReader(); r.onload=function(){
      var body; try{body=JSON.parse(r.result);}catch(e){msg('<%:JSON格式错误%>',false);return;}
      api('/api/config/import','POST',body,function(d){msg('<%:配置已导入%>',!d.error);refreshAll();});
    }; r.readAsText(f);
  };
  document.getElementById('ct-full-panel').href='http://'+ip+':'+port;

  // 启动
  if(TOKEN){ showMain(); refreshAll(); } else { showLogin(); }
  setInterval(function(){ if(document.querySelector('.ct-view[data-view="overview"]').classList.contains('show')) refreshAll(); }, 10000);
})();
</script>
